# Etapa 1: LiveKit self-hosted (voz/vídeo/tela)
# Etapa 2: + Backend (identificação simples + geração de token)
#
# Sem Postgres por enquanto — o app não guarda nenhum dado persistente
# ainda (identificação é só um nome, sem conta). Volta quando o chat de
# texto precisar guardar histórico de mensagens.
#
# Rodar tudo: docker compose up -d
# Rodar sem o LiveKit (ex: Windows com bug de UDP, ver RODANDO_SEM_DOCKER.md):
#   docker compose up -d backend

services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-dev
    # --node-ip: troque pelo SEU IP do Tailscale (rode `tailscale ip -4` pra
    # descobrir, formato 100.x.x.x). Esse é o endereço que seus amigos vão
    # usar pra alcançar seu LiveKit através da rede privada do Tailscale,
    # sem precisar de VPS/domínio/porta aberta no roteador.
    #
    # Enquanto só você estiver testando sozinho (2 abas no mesmo PC),
    # pode deixar 127.0.0.1. Troque para o IP do Tailscale assim que for
    # testar com alguém de fora.
    command: --dev --bind 0.0.0.0 --node-ip=127.0.0.1
    restart: unless-stopped
    ports:
      - "7880:7880"        # HTTP/WebSocket (signaling)
      - "7881:7881"        # RTC TCP fallback (ICE-TCP)
      - "7882:7882/udp"    # RTC UDP mux — TODA a mídia (áudio/vídeo/tela)
                            # passa por essa ÚNICA porta UDP no modo --dev.
    # OBS: no Windows, o Docker Desktop tem um bug conhecido de repasse de
    # portas UDP via WSL2, que impede áudio/vídeo de funcionar entre PCs
    # diferentes mesmo com tudo configurado certo aqui. Se isso acontecer,
    # rode o livekit-server.exe nativo em vez deste serviço — guia completo
    # em RODANDO_SEM_DOCKER.md (ou use start.bat / start-livekit.bat, que já
    # fazem isso automaticamente). Nesse caso, comente este serviço
    # "livekit" inteiro e suba só o outro: docker compose up -d backend

  backend:
    build: ./backend
    container_name: discord-privado-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      # Persiste o banco SQLite (histórico do chat) entre reinícios do
      # container — sem isso, o "docker compose up --build" apagaria o
      # histórico toda vez.
      - ./backend/data:/app/data
